<svg width="1098" height="214" viewBox="0 0 1098 214" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      /* Wavy animation for letters */
      @keyframes letterWave {
        0%, 100% { transform: translateY(0px); }
        50%      { transform: translateY(-10px); }
      }

      .wave-char {
        animation: letterWave 1.4s ease-in-out infinite;
      }

      .char-1 { animation-delay: 0.00s; }
      .char-2 { animation-delay: 0.12s; }
      .char-3 { animation-delay: 0.24s; }
      .char-4 { animation-delay: 0.36s; }
      .char-5 { animation-delay: 0.48s; }
      .char-6 { animation-delay: 0.60s; }
      .char-7 { animation-delay: 0.72s; }
      .char-8 { animation-delay: 0.84s; }
      .char-9 { animation-delay: 0.96s; }

      /* Horizontal easing animation for left chevron */
      @keyframes chevronLeftSlide {
        0%, 100% { transform: translateX(0px); }
        50%      { transform: translateX(-8px); }
      }

      /* Horizontal easing animation for right chevron */
      @keyframes chevronRightSlide {
        0%, 100% { transform: translateX(0px); }
        50%      { transform: translateX(8px); }
      }

      .chevron-left {
        animation: chevronLeftSlide 1.6s steps(2, end) infinite;
      }

      .chevron-right {
        animation: chevronRightSlide 1.6s steps(2, end) infinite;
      }
    </style>
    <clipPath id="clip0_1_2">
      <rect width="1098" height="214" fill="white"/>
    </clipPath>
  </defs>

